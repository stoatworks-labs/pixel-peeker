# Cloudflare Worker config for the LITE variant.
#
# Separate from wrangler.toml so the two cannot collide: each file names one Worker and
# one output directory, and `npm run deploy:lite` passes this one with -c. Sharing a
# single config and overriding the name invites deploying the wrong build to the wrong
# Worker.
#
# See README "Two builds". Build with `npm run build:lite` (writes dist-lite/), which
# runs scripts/check-lite.mjs to prove the NovaStar exports really are gone.
#
# In the Cloudflare project for this Worker:
#   Build command:  npm ci && npm run build:lite
#   Deploy command: npx wrangler deploy -c wrangler.lite.toml
name = "pixel-peeker-lite"
compatibility_date = "2026-07-30"

[assets]
directory = "./dist-lite"
