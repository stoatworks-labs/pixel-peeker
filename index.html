    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "@id": "https://pixel-peeker.stoatworks-labs.com#app",
        "name": "Pixel Peeker",
        "url": "https://pixel-peeker.stoatworks-labs.com",

          "@type": "Organization",

    <meta name="twitter:image" content="https://stoatworks-labs.com/thumbs/pixel-peeker.png">
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons entirely and wants a PNG of its own. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#0e1116" />

  <body>
    <noscript>
      <h1>Pixel Peeker</h1>
      <p>LED wall layout, and what each port will carry.</p>
      <p>A browser tool for planning LED video walls: lay out the cabinets, add NovaStar or Brompton processors, wire up the ports, and see each port's load and headroom. The capacity model allows for the power-of-two packing the controllers actually use, so it matches the manufacturers' published per-port figures instead of promising more than a port will carry.</p>
      <p>Pixel Peeker runs in the browser and needs JavaScript.</p>
      <ul>
        <li><a href="https://stoatworks-labs.com/software/pixel-peeker/">Pixel Peeker on stoatworks-labs.com</a></li>
        <li><a href="https://stoatworks-labs.com/software/pixel-peeker/guide/">User guide</a></li>
        <li><a href="https://github.com/stoatworks-labs/pixel-peeker">Source on GitHub</a></li>
        <li><a href="https://stoatworks-labs.com/web-tools/self-hosting/">Running it on your own server</a></li>
      </ul>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      About dialog. Both files are vendored from stoatworks-backend/about and
      generated by its sync-about.py — edit them there, never here. Classic +
      defer like the support footer: about-data.js only sets defaults, so it and
      the app's own startup can load in either order.
    -->
    <script src="/about-data.js" defer></script>
    <script src="/about.js" defer></script>
    <!--
      Support footer. Vendored from stoatworks-backend/support-footer — edit it
      there and re-run scripts/sync-support-footer.sh, never here.
      Classic + defer on purpose: it reads its config off this tag, and
      document.currentScript is null inside a module.
    -->
    <script
      src="/support-footer.js"
      defer
      data-app="Pixel Peeker"
      data-repo="https://github.com/stoatworks-labs/pixel-peeker"
      data-note="It runs entirely in your browser — no account, and no wall you design is uploaded."
    ></script>
  </body>
</html>
